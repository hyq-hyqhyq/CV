experiment:
  name: resnet18_scratch
  output_dir: /mnt/data/huangyingqian/code/CV/task1/outputs
  seed: 42
dataset:
  root: /mnt/data/huangyingqian/code/CV/task1/data
  download: true
  val_ratio: 0.15
  image_size: 224
  batch_size: 32
  num_workers: 2
  pin_memory: true
  train_resize_scale:
  - 0.7
  - 1.0
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: resnet18
  num_classes: 37
  pretrained: false
  dropout: 0.0
training:
  device: auto
  epochs: 30
  optimizer: adamw
  backbone_lr: 0.001
  head_lr: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  min_lr: 1.0e-06
  label_smoothing: 0.0
  amp: true
  grad_clip_norm: 0.0
logging:
  backend: none
  project: oxfordiiit-pet
  entity: null
  run_name: null
  log_interval: 20
evaluation:
  save_best_only: true
_meta:
  config_path: /mnt/data/huangyingqian/code/CV/task1/configs/resnet18_scratch.yaml
